name: Rumble Racing Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build PS2 Runtime ARM64
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: platforms/android

    steps:
      - name: Checkout ARMSX2
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK, CMake and Build Tools
        run: |
          yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" "build-tools;35.0.0" >/dev/null

      - name: Sync shaderc dependencies
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Setup Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build ARM64 debug APK
        run: ./gradlew :app:assembleGithubDebug --stacktrace -Parmsx2.applicationId=com.rumble.racing -Parmsx2.appLabel="Rumble Racing"

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/github/debug -name "*.apk" -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Show generated APK files
        if: always()
        run: |
          echo "Searching APK files..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rumble-Racing-ARM64-Test
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/**/*.apk
          if-no-files-found: error
